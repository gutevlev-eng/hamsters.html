<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10131c">
<title>Hamster Empire — Business Edition</title>
<style>
:root{
 color-scheme:dark;
 --bg:#10131c;--surface:#191e2b;--panel:rgba(29,36,52,.94);
 --input:#131a28;--text:#f5f7ff;--muted:#95a3bb;
 --border:rgba(190,211,255,.12);--gold:#f4c45a;
 --blue:#58c9ff;--green:#65dfac;--nav:rgba(16,21,32,.97);
 --shadow:0 18px 48px #0003;--glow:rgba(58,103,214,.2)
}
[data-theme="light"]{
 color-scheme:light;
 --bg:#edf1f8;--surface:#fff;--panel:rgba(255,255,255,.96);
 --input:#eef2f9;--text:#182338;--muted:#687891;
 --border:rgba(39,64,106,.14);--gold:#bd8410;
 --blue:#087fc0;--green:#138859;--nav:rgba(255,255,255,.98);
 --shadow:0 15px 45px #243b6010;--glow:rgba(83,133,233,.13)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;overscroll-behavior:none}
body{
 background:var(--bg);color:var(--text);
 font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
 transition:background .25s,color .25s
}
button,input,select{font:inherit}
button{
 color:inherit;border:0;cursor:pointer;touch-action:manipulation;
 user-select:none;-webkit-user-select:none
}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{
 outline:3px solid var(--blue);outline-offset:3px
}
.app{
 width:min(100%,540px);min-height:100dvh;margin:auto;
 position:relative;isolation:isolate;overflow:hidden;
 background:radial-gradient(ellipse at 50% 22%,var(--glow),transparent 52%),var(--bg)
}
.ambient{position:absolute;inset:0;pointer-events:none;z-index:-1;overflow:hidden}
.ambient::before,.ambient::after{
 content:"";position:absolute;width:350px;height:350px;border-radius:50%;
 filter:blur(65px);opacity:.14;background:#3479ff;left:-190px;top:180px;
 animation:ambientMove 15s ease-in-out infinite alternate
}
.ambient::after{left:auto;right:-210px;top:460px;background:#e7a231;animation-delay:-7s}
@keyframes ambientMove{to{transform:translate(70px,110px) scale(1.15)}}
.header{padding:calc(17px + env(safe-area-inset-top)) 18px 10px}
.profile{display:flex;align-items:center;gap:10px}
.avatar{
 flex:none;width:46px;height:46px;border-radius:16px;display:grid;
 place-items:center;font-size:27px;overflow:hidden;
 background:linear-gradient(145deg,#f7d581,#9f6925);
 box-shadow:inset 0 0 0 1px #ffffff45,0 5px 17px #0002
}
.avatar img{width:100%;height:100%;object-fit:contain}
.profile-info{min-width:0;flex:1}
.profile-name{font-weight:850;font-size:14px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.sub{font-size:10px;color:var(--muted);margin-top:4px}
.icon-button{
 flex:none;width:38px;height:38px;border-radius:12px;display:grid;
 place-items:center;background:var(--panel);border:1px solid var(--border);font-size:20px
}
.exchange-button{
 display:flex;align-items:center;gap:6px;padding:9px 8px;
 border:1px solid var(--border);border-radius:12px;background:var(--panel);font-size:10px
}
.exchange-logo{
 width:21px;height:21px;border-radius:7px;display:grid;
 place-items:center;font-weight:900;background:#f4c45a;color:#37270c;flex:none
}
.rank-row{display:flex;justify-content:space-between;align-items:center;font-size:11px;margin:16px 0 8px;gap:10px}
.rank-row strong{font-size:12px}
.progress{height:7px;border-radius:20px;background:var(--border);overflow:hidden}
.progress i{
 display:block;height:100%;width:0;border-radius:inherit;
 background:linear-gradient(90deg,#497aff,#58c9ff,#f4c45a);transition:width .3s linear
}
main{padding:9px 16px calc(99px + env(safe-area-inset-bottom))}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--panel);border:1px solid var(--border);padding:12px 5px;border-radius:16px;text-align:center;min-width:0}
.stat-label{font-size:10px;color:var(--muted);min-height:27px;line-height:1.4}
.stat-value{font-size:15px;font-weight:850;margin-top:4px}
.gold{color:var(--gold)}.green{color:var(--green)}.blue{color:var(--blue)}
.balance{
 display:flex;align-items:center;justify-content:center;gap:11px;
 margin:23px 0 6px;font-size:clamp(26px,8vw,42px);font-weight:900;
 letter-spacing:-1.2px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere
}
.coin{
 flex:none;width:39px;height:39px;border-radius:50%;display:grid;place-items:center;
 font-size:23px;color:#936214;background:linear-gradient(140deg,#fff1b6,#fbc94e 55%,#d99720);
 border:3px solid #ffe38d;box-shadow:inset 0 0 0 2px #dba434,0 5px 20px #f3ba2f25
}
.balance-caption{text-align:center;font-size:11px;color:var(--muted)}
.hero-wrap{width:min(100%,350px);margin:17px auto 11px;position:relative;aspect-ratio:1}
.hero-wrap::before{
 content:"";position:absolute;inset:3px;border-radius:50%;border:1px dashed #789cff45;
 animation:orbit 55s linear infinite;pointer-events:none
}
.hero-wrap::after{
 content:"";position:absolute;inset:0;border-radius:50%;box-shadow:0 0 45px #3977ff18;
 animation:breathe 4s ease-in-out infinite;pointer-events:none
}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes breathe{50%{opacity:.4;transform:scale(1.035)}}
.hero{
 position:absolute;inset:13px;width:calc(100% - 26px);border-radius:50%;
 padding:0;overflow:hidden;touch-action:none;user-select:none;
 background:radial-gradient(ellipse at 50% 87%,#01061280,transparent 44%),
 radial-gradient(circle at 50% 32%,#405982,#223b65 45%,#111e37 85%);
 border:4px solid #5875a955;
 box-shadow:inset 0 0 38px #94bfff14,0 13px 40px #0002,0 0 0 6px #5579bd0c;
 transition:transform .13s ease-out;will-change:transform
}
.hero.cipher{background:radial-gradient(circle at 50% 35%,#683c58,#281a32);border-color:#ca668a70}
.hero-photo{
 position:absolute;left:4%;bottom:2%;width:92%;height:92%;object-fit:contain;
 pointer-events:none;filter:drop-shadow(0 12px 8px #0005);
 animation:hamsterBreath 4.8s ease-in-out infinite;transform-origin:50% 95%
}
@keyframes hamsterBreath{50%{transform:translateY(-3px) scale(1.008)}}
.photo-button{
 display:block;margin:0 auto 18px;font-size:11px;padding:8px 13px;border-radius:20px;
 background:var(--panel);border:1px solid var(--border);color:var(--muted)
}
.status-row{display:flex;align-items:center;gap:13px}
.energy{flex:1;min-width:0}
.energy-label{display:flex;align-items:center;justify-content:space-between;gap:7px;margin-bottom:8px;font-weight:750;font-size:12px}
.energy .progress i{background:linear-gradient(90deg,#df9a2d,#ffe19b)}
.boost{padding:13px 16px;border-radius:14px;background:var(--panel);border:1px solid var(--border);font-size:12px;font-weight:850}
.quick-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:17px 0 12px}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:19px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.no-shadow{box-shadow:none}
.section-title{font-size:25px;letter-spacing:-.8px;margin:9px 0;font-weight:900}
.description{font-size:12px;line-height:1.75;color:var(--muted);margin:0 0 15px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.small{font-size:11px;line-height:1.65;color:var(--muted)}
.btn{
 display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:43px;
 padding:12px 15px;border-radius:13px;background:linear-gradient(135deg,#f9d584,#eeb84d);
 color:#352509;font-size:12px;font-weight:850;text-decoration:none;transition:transform .15s
}
.btn:not(:disabled):active{transform:scale(.97)}
.btn.secondary{background:var(--input);color:var(--text);border:1px solid var(--border)}
.btn.success{background:#66dbad;color:#0c3626}
.btn.danger{background:#e45b6c;color:#fff}
.btn.wide{width:100%;margin-top:12px}
.tabs{display:flex;gap:7px;padding:3px 0 13px;overflow-x:auto;scrollbar-width:none}
.tab{flex:none;white-space:nowrap;border-radius:11px;padding:10px 13px;background:var(--panel);border:1px solid var(--border);font-size:11px}
.tab.active{background:#f4c45a;color:#352509;font-weight:850;border-color:transparent}
.search-row{display:flex;gap:8px;margin-bottom:13px}
.field{width:100%;min-width:0;border:1px solid var(--border);background:var(--input);color:var(--text);border-radius:12px;padding:12px}
.search-row select{max-width:145px;font-size:11px}
.card-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.mine-card{
 display:flex;flex-direction:column;text-align:left;overflow:hidden;border-radius:17px;
 border:1px solid var(--border);background:var(--panel);padding:0;min-height:212px;
 transition:transform .16s,border-color .16s
}
.mine-card:hover{border-color:#81aaff40}
.mine-card:active{transform:scale(.98)}
.card-art{
 position:relative;height:67px;display:grid;place-items:center;
 background:radial-gradient(ellipse at 50% 100%,var(--card-glow,#428bff22),transparent 80%);
 font-size:35px;border-bottom:1px solid var(--border)
}
.card-level{position:absolute;right:8px;top:8px;border-radius:6px;background:var(--input);color:var(--muted);font-size:9px;padding:4px 6px}
.card-body{padding:11px;flex:1}
.card-name{font-size:12px;font-weight:850;min-height:30px;line-height:1.4}
.card-profit{font-size:11px;color:var(--green);margin:7px 0}
.card-footer{padding:11px;border-top:1px solid var(--border);font-size:12px;font-weight:850;min-height:39px}
.lock-text{color:var(--muted);font-size:10px;line-height:1.5}
.combo{display:flex;gap:7px;margin:13px 0}
.combo-slot{
 flex:1;min-width:0;background:var(--input);border:1px dashed var(--border);
 border-radius:12px;padding:10px 4px;text-align:center;display:flex;flex-direction:column;
 gap:5px;justify-content:center;font-size:10px;min-height:76px
}
.combo-slot b{font-size:24px}
.combo-slot.found{border-color:var(--green);background:#22c55e0c}
.nav{
 position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,540px);
 z-index:30;padding:9px 9px calc(10px + env(safe-area-inset-bottom));
 background:var(--nav);backdrop-filter:blur(20px);border-top:1px solid var(--border);
 display:grid;grid-template-columns:repeat(4,1fr);gap:5px
}
.nav button{position:relative;background:transparent;color:var(--muted);border-radius:14px;padding:9px 3px;font-size:10px}
.nav button.active{background:#f4c45a0e;color:var(--gold)}
.nav-icon{display:block;font-size:23px;margin-bottom:5px}
.badge{position:absolute;top:5px;right:25%;width:6px;height:6px;border-radius:50%;background:var(--gold)}
.overlay{
 position:fixed;inset:0;z-index:80;background:#0009;backdrop-filter:blur(8px);
 display:flex;align-items:flex-end;justify-content:center;padding-top:25px;animation:fadeIn .18s
}
.modal{
 width:min(100%,540px);max-height:92dvh;overflow:auto;
 padding:18px 19px calc(24px + env(safe-area-inset-bottom));
 background:var(--surface);border:1px solid var(--border);border-radius:26px 26px 0 0;
 box-shadow:0 -20px 65px #0004;animation:slideIn .22s ease-out
}
.modal-handle{width:40px;height:4px;border-radius:5px;background:var(--muted);opacity:.3;margin:0 auto 18px}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}
.modal-head h2{font-size:21px;margin:0}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideIn{from{opacity:0;transform:translateY(50px)}to{opacity:1;transform:none}}
.toast{
 position:fixed;top:calc(18px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
 z-index:120;width:max-content;max-width:min(90vw,440px);background:var(--surface);
 border:1px solid var(--border);border-radius:14px;padding:13px 17px;font-size:12px;
 line-height:1.6;text-align:center;box-shadow:var(--shadow);pointer-events:none;animation:fadeIn .15s
}
.float-number{
 position:fixed;z-index:60;pointer-events:none;color:#fff;font-size:31px;font-weight:900;
 text-shadow:0 2px 4px #0008,0 0 15px #f4c45a60;animation:floatUp .8s ease-out forwards
}
@keyframes floatUp{
 0%{opacity:1;transform:translate(-50%,-50%) scale(.85)}
 20%{transform:translate(-50%,-80%) scale(1.06)}
 100%{opacity:0;transform:translate(-50%,-160px) scale(.94)}
}
.setting{padding:13px 0;border-bottom:1px solid var(--border)}
.segment{display:flex;gap:7px;margin-top:10px}
.segment button{flex:1}
.notice{padding:12px;margin:12px 0;border-radius:12px;background:#58c9ff0b;border:1px solid #58c9ff22;color:var(--muted);font-size:11px;line-height:1.75}
.calendar{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:14px 0}
.day{background:var(--input);border:1px solid var(--border);border-radius:11px;text-align:center;padding:9px 2px;font-size:10px}
.day.current{border-color:var(--gold)}
.day.done{background:#22c55e0c;border-color:#22c55e40}
.task{display:flex;align-items:center;gap:11px;padding:13px 0;border-bottom:1px solid var(--border)}
.task:last-child{border-bottom:0}
.task-icon{font-size:27px;flex:none}
.task-info{flex:1;min-width:0}
.task-title{font-weight:850;font-size:12px;line-height:1.5}
.separator{height:1px;background:var(--border);margin:14px 0}
.cipher-box{border:1px solid #bb668655;border-radius:16px;padding:14px;margin-top:16px;text-align:center}
.cipher-code{color:#ed88ac;font-size:26px;font-weight:900;min-height:35px;letter-spacing:5px}
.cipher-word{font-size:19px;font-weight:850;letter-spacing:5px;margin:7px 0}
details{font-size:11px;color:var(--muted);line-height:1.8;margin-top:12px}
summary{color:var(--text);cursor:pointer}
.mono{font-family:ui-monospace,Consolas,monospace;word-break:break-all}
.avatar-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:15px 0}
.avatar-choice{aspect-ratio:1;border-radius:14px;background:var(--input);border:1px solid var(--border);font-size:28px;overflow:hidden}
.avatar-choice.selected{border-color:var(--gold);background:#f4c45a16}
.avatar-choice img{width:100%;height:100%;object-fit:contain}
.offline-photo{width:230px;height:230px;display:block;object-fit:contain;margin:0 auto;filter:drop-shadow(0 12px 13px #0003)}
.photo-preview{width:100%;height:230px;object-fit:contain;border-radius:15px;background:radial-gradient(circle at 50% 35%,#405982,#162742)}
.photo-options{display:flex;align-items:center;gap:9px;font-size:12px;margin:12px 0}
.photo-options input{width:19px;height:19px}
.puzzle-board{
 display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(6,1fr);
 aspect-ratio:1;padding:6px;gap:4px;margin:15px 0;border:2px solid var(--border);
 border-radius:16px;background:var(--input);position:relative
}
.puzzle-cell{background:var(--border);opacity:.3;border-radius:5px;grid-row:var(--r);grid-column:var(--c)}
.vehicle{
 z-index:2;display:grid;place-items:center;font-size:20px;border-radius:8px;
 color:white;border:2px solid #ffffff40;background:linear-gradient(145deg,#32b17c,#116342);
 box-shadow:0 4px 8px #0002
}
.vehicle.red{background:linear-gradient(145deg,#de687d,#92364b)}
.vehicle.key{background:linear-gradient(145deg,#ffdf8c,#cb922c);color:#523a10}
.vehicle.selected{outline:3px solid #58c9ff}
.puzzle-exit{position:absolute;right:-14px;top:35%;font-size:22px;color:var(--gold);z-index:4}
.arrows{display:flex;justify-content:center;gap:8px}
.arrows button{min-width:52px;font-size:21px}
.empty{text-align:center;color:var(--muted);padding:30px 15px;font-size:12px}
.stat-list{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.stat-list .panel{margin:0;padding:12px}
.stat-list strong{display:block;margin-top:5px;font-size:16px}
.promo-input{text-transform:uppercase;font-weight:800;letter-spacing:1.5px}
.promo-message{min-height:20px;margin-top:10px;font-size:12px;line-height:1.6}
.save-panel{margin-top:22px;border-color:#58c9ff30}
@media(min-width:700px){
 .app{box-shadow:0 0 90px #0002}
 .overlay{align-items:center;padding:25px}
 .modal{border-radius:25px;max-height:89dvh}
}
@media(max-height:750px){
 .hero-wrap{width:min(100%,285px);margin-top:10px}
 .balance{margin-top:16px}
}
@media(max-width:360px){
 .header{padding-left:12px;padding-right:12px}
 .exchange-button{font-size:9px;gap:3px;padding:8px 5px}
 main{padding-left:12px;padding-right:12px}
 .stat-value{font-size:13px}
}
@media(prefers-reduced-motion:reduce){
 *,*::before,*::after{
  animation-duration:.01ms!important;animation-iteration-count:1!important;
  transition-duration:.01ms!important
 }
}
</style>
</head>
<body>
<div class="app">
 <div class="ambient" aria-hidden="true"></div>
 <header id="header" class="header"></header>
 <main id="main"></main>
 <nav id="nav" class="nav" aria-label="Навигация"></nav>
</div>
<div id="modal-root"></div>
<div id="toast-root" aria-live="polite"></div>
<script id="embedded-assets" type="application/json">{"photo":"","avatar":""}</script>
<script>
"use strict";

/*
 Без регистрации и сервера.
 Общий прогресс хранится по постоянному ключу SAVE_KEY.
 Доход в час всегда пересчитывается по уровням сохранённых бизнесов.
 Старые сохранения не удаляются при автоматическом переносе.
*/

   try{

   }catch{}
  }

  const candidates=[];
  for(let i=0;i<localStorage.length;i++){
   const key=localStorage.key(i);
   if(!key||!key.startsWith(OLD_SAVE_PREFIX))continue;
   const data=parseJSON(localStorage.getItem(key));
   if(validSave(data))candidates.push({key,data});
  }
  candidates.sort((a,b)=>finite(b.data.lastSeen)-finite(a.data.lastSeen));

  if(candidates.length){
   const selected=candidates[0];
   state=normalizeState(selected.data);
   const suffix=selected.key.slice(OLD_SAVE_PREFIX.length);
   assets=mergeAssets(
    parseJSON(localStorage.getItem(OLD_ASSET_PREFIX+suffix)),embedded
   );

  }

  const oldKeys=[
   "hamster-empire-business-v4",
   "hamster-empire-business-v3",
   "hamster-empire-browser-v1"
  ];
  for(const key of oldKeys){

function sound(kind="tap"){
 if(!state.sound||!active)return;
 try{
  const Audio=window.AudioContext||window.webkitAudioContext;
  if(!Audio)return;
  if(!soundContext)soundContext=new Audio();
  if(soundContext.state==="suspended")soundContext.resume().catch(()=>{});
  const start=soundContext.currentTime;
  const frequencies=kind==="reward"?[523,659,784,1047]:
   kind==="buy"?[440,660]:kind==="error"?[160]:[740];
  frequencies.forEach((frequency,i)=>{
   const oscillator=soundContext.createOscillator(),gain=soundContext.createGain();
   const t=start+i*.075;
   oscillator.connect(gain);gain.connect(soundContext.destination);
   oscillator.type=kind==="tap"?"sine":"triangle";
   oscillator.frequency.setValueAtTime(frequency,t);
   if(kind==="tap")oscillator.frequency.exponentialRampToValueAtTime(380,t+.065);
   gain.gain.setValueAtTime(.0001,t);
   gain.gain.exponentialRampToValueAtTime(kind==="tap"?.07:.1,t+.008);
   gain.gain.exponentialRampToValueAtTime(.0001,t+.12);
   oscillator.start(t);oscillator.stop(t+.14);
  });
 }catch{}
}

async function processImage(file,removeWhite=false,avatar=false){
 if(!file||!file.type.startsWith("image/")){
  throw new Error(T("Выбери изображение.","Choose an image."));
 }
 if(file.size>15*1024*1024)throw new Error(T("Максимум 15 МБ.","Maximum 15 MB."));
 const url=URL.createObjectURL(file);
 try{
  const image=await new Promise((resolve,reject)=>{
   const img=new Image();
   img.onload=()=>resolve(img);
   img.onerror=()=>reject(new Error(T("Не удалось открыть фото.","Could not open image.")));
   img.src=url;
  });
  if(!image.naturalWidth||!image.naturalHeight)throw new Error(T("Пустое изображение.","Empty image."));
  const canvas=document.createElement("canvas");
  const scale=Math.min(1,720/Math.max(image.naturalWidth,image.naturalHeight));
  const w=avatar?160:Math.max(1,Math.round(image.naturalWidth*scale));
  const h=avatar?160:Math.max(1,Math.round(image.naturalHeight*scale));
  canvas.width=w;canvas.height=h;
  const ctx=canvas.getContext("2d",{willReadFrequently:true});
  if(!ctx)throw new Error("Canvas unavailable");
  if(avatar){
   const side=Math.min(image.naturalWidth,image.naturalHeight);
   ctx.drawImage(image,(image.naturalWidth-side)/2,(image.naturalHeight-side)/2,
    side,side,0,0,w,h);
  }else ctx.drawImage(image,0,0,w,h);

  if(removeWhite&&!avatar){
   const pixels=ctx.getImageData(0,0,w,h),data=pixels.data,count=w*h;
   const marked=new Uint8Array(count),queue=new Int32Array(count);
   let head=0,tail=0;
   const isBackground=i=>{
    const offset=i*4;
    if(data[offset+3]<15)return true;
    const min=Math.min(data[offset],data[offset+1],data[offset+2]);
    const max=Math.max(data[offset],data[offset+1],data[offset+2]);
    return min>=214&&max-min<=29;
   };
   const add=i=>{
    if(i<0||i>=count||marked[i]||!isBackground(i))return;
    marked[i]=1;queue[tail++]=i;
   };
   for(let x=0;x<w;x++){add(x);add((h-1)*w+x)}
   for(let y=0;y<h;y++){add(y*w);add(y*w+w-1)}
   while(head<tail){
    const i=queue[head++],x=i%w;
    if(x>0)add(i-1);
    if(x<w-1)add(i+1);
    if(i>=w)add(i-w);
    if(i<count-w)add(i+w);
   }
   for(let i=0;i<count;i++)if(marked[i])data[i*4+3]=0;
   for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){
    const i=y*w+x;
    if(marked[i])continue;
    let near=false;
    for(let dy=-1;dy<=1&&!near;dy++)for(let dx=-1;dx<=1;dx++){
     if(marked[i+dy*w+dx]){near=true;break}
    }
    if(!near)continue;
    const offset=i*4;
    const min=Math.min(data[offset],data[offset+1],data[offset+2]);
    const max=Math.max(data[offset],data[offset+1],data[offset+2]);
    if(min>160&&max-min<80){
     const alpha=clamp((255-min)/85,.08,1);
     data[offset+3]=Math.round(data[offset+3]*alpha);
     if(alpha<1)for(let c=0;c<3;c++){
      data[offset+c]=clamp(Math.round((data[offset+c]-255*(1-alpha))/alpha),0,255);
     }
    }
   }
   ctx.putImageData(pixels,0,0);
   let minX=w,minY=h,maxX=-1,maxY=-1;
   for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    if(data[(y*w+x)*4+3]>40){
     minX=Math.min(minX,x);minY=Math.min(minY,y);
     maxX=Math.max(maxX,x);maxY=Math.max(maxY,y);
    }
   }
   if(maxX>=minX&&maxY>=minY){
    const out=document.createElement("canvas"),padding=12;
    out.width=maxX-minX+1+padding*2;out.height=maxY-minY+1+padding*2;
    const outCtx=out.getContext("2d");
    if(!outCtx)throw new Error("Canvas unavailable");
    outCtx.drawImage(canvas,minX,minY,maxX-minX+1,maxY-minY+1,
     padding,padding,maxX-minX+1,maxY-minY+1);
    return out.toDataURL("image/png");
   }
  }
  return canvas.toDataURL("image/png");
 }finally{URL.revokeObjectURL(url)}
}
async function uploadImage(avatar=false){
 if(photoBusy)return;
 const file=$(avatar?"#avatar-file":"#photo-file")?.files?.[0];
 if(!file){toast(T("Сначала выбери изображение.","Choose an image first."));return}
 const removeWhite=!avatar&&!!$("#photo-remove-white")?.checked;
 const epoch=dataEpoch;
 photoBusy=true;renderModal();
 try{
  const data=await processImage(file,removeWhite,avatar);
  if(epoch!==dataEpoch)return;
  if(avatar){assets.avatar=data;state.avatar="custom"}
  else assets.photo=data;
  const persisted=saveAssets();
  save();render();
  if(persisted)toast(T("Изображение сохранено.","Image saved."));
 }catch(error){
  if(epoch===dataEpoch)toast(error.message||T("Ошибка обработки.","Processing failed."));
 }finally{
  photoBusy=false;
  if(["avatar","photo"].includes(modalName))renderModal();
 }
}
async function embedDefaultPhoto(){
 if(assets.photo)return assets.photo;
 if(defaultPhotoData)return defaultPhotoData;
 const image=await new Promise((resolve,reject)=>{
  const img=new Image();
  img.onload=()=>resolve(img);
  img.onerror=()=>reject(new Error(T(
   "Не найден hamster.png. Загрузи фото через настройки.",
   "hamster.png not found. Upload a photo in settings."
  )));
  img.src=DEFAULT_PHOTO;
 });
 const canvas=document.createElement("canvas");
 canvas.width=image.naturalWidth;canvas.height=image.naturalHeight;
 const ctx=canvas.getContext("2d");
 if(!ctx)throw new Error("Canvas unavailable");
 ctx.drawImage(image,0,0);
 try{
  defaultPhotoData=canvas.toDataURL("image/png");
  return defaultPhotoData;
 }catch{
  throw new Error(T(
   "Браузер блокирует встраивание локального фото. Загрузи его через настройки.",
   "The browser blocked embedding a local image. Upload it in settings."
  ));
 }
}

 return "";
}

function bindHero(){
 const hero=$("#hero");
 if(!hero)return;
 activePointers.clear();
 hero.addEventListener("pointerdown",event=>{
  if(modalName||!active||(event.pointerType==="mouse"&&event.button!==0))return;
  event.preventDefault();
  if(activePointers.size>=4||(cipherMode&&activePointers.size))return;
  const entry={start:performance.now(),x:event.clientX,y:event.clientY};
  activePointers.set(event.pointerId,entry);
  try{hero.setPointerCapture(event.pointerId)}catch{}
  const rect=hero.getBoundingClientRect();
  const x=(event.clientX-rect.left)/rect.width-.5,y=(event.clientY-rect.top)/rect.height-.5;
  hero.style.transform=`perspective(600px) rotateX(${-y*12}deg) rotateY(${x*12}deg) scale(.967)`;
  clearTimeout(tiltTimer);tiltTimer=setTimeout(()=>hero.style.transform="",135);
  if(cipherMode)clearTimeout(cipherTimer);
  else doTap(entry.x,entry.y);
 });
 hero.addEventListener("pointerup",event=>{
  const entry=activePointers.get(event.pointerId);
  if(!entry)return;
  activePointers.delete(event.pointerId);
  if(cipherMode)addCipherSymbol(performance.now()-entry.start>300?"-":".",entry);
 });
 hero.addEventListener("pointercancel",event=>{
  activePointers.delete(event.pointerId);hero.style.transform="";
 });
 hero.addEventListener("lostpointercapture",event=>activePointers.delete(event.pointerId));
 hero.addEventListener("keydown",event=>{
  if(!["Space","Enter"].includes(event.code)||modalName||!active)return;
  event.preventDefault();
  if(event.repeat)return;
  const rect=hero.getBoundingClientRect();
  const entry={start:performance.now(),x:rect.left+rect.width/2,y:rect.top+rect.height/2};
  if(cipherMode){
   if(activePointers.size)return;
   activePointers.set("keyboard",entry);clearTimeout(cipherTimer);
  }else doTap(entry.x,entry.y);
 });
 hero.addEventListener("keyup",event=>{
  if(!["Space","Enter"].includes(event.code))return;
  event.preventDefault();
  const entry=activePointers.get("keyboard");
  if(!entry)return;
  activePointers.delete("keyboard");
  if(cipherMode)addCipherSymbol(performance.now()-entry.start>300?"-":".",entry);
 });
 hero.addEventListener("blur",()=>activePointers.delete("keyboard"));
}
function doTap(x,y){
 if(!active)return;
 settle(false);
 const t=performance.now();
 if(t-lastAcceptedTap<4)return;
 lastAcceptedTap=t;
 const gain=tapValue();
 if(state.energy+1e-8<gain){
  sound("error");toast(T("Не хватает энергии. Подожди или используй буст.","Not enough energy. Wait or use a boost."));return;
 }
 state.energy=Math.max(0,state.energy-gain);
 credit(gain);state.stats.taps++;
 sound();haptic();floatNumber(x,y,"+"+fmt(gain));checkRank();updateHUD();
}
function addCipherSymbol(symbol,entry){
 clearTimeout(cipherTimer);cipherSymbols+=symbol;sound();haptic();
 floatNumber(entry.x,entry.y,symbol==="."?"•":"—");
 if(cipherSymbols.length>4){
  cipherSymbols="";sound("error");
  toast(T("В букве не больше четырёх сигналов.","A letter has at most four signals."));
  updateCipherUI();return;
 }
 updateCipherUI();cipherTimer=setTimeout(finishCipherLetter,900);
}
function updateCipherUI(){
 setText("#cipher-code",cipherSymbols.replace(/\./g,"•").replace(/-/g,"—")||" ");
 setText("#cipher-word",cipherLetters||"_");
}
function finishCipherLetter(){
 if(!cipherMode||!active)return;
 rollDays();
 if(!cipherMode)return;
 const letter=MORSE[cipherSymbols];cipherSymbols="";
 if(!letter){
  sound("error");toast(T("Неизвестный сигнал. Повтори букву.","Unknown signal. Repeat the letter."));
  updateCipherUI();return;
 }
 cipherLetters+=letter;
 if(!dailyWord().startsWith(cipherLetters)){
  sound("error");toast(T("Неверная последовательность. Начни заново.","Incorrect sequence. Start again."));
  cipherLetters="";updateCipherUI();return;
 }
 updateCipherUI();
 if(cipherLetters===dailyWord()){
  if(!state.cipherClaimed){
   settle(false);state.cipherClaimed=true;credit(1000000);
   save();sound("reward");toast(T("Шифр разгадан! +1 000 000","Cipher solved! +1,000,000"));
  }
  cipherMode=false;clearCipher();render();
 }
}
function toggleCipher(){
 rollDays();
 if(state.cipherClaimed&&!cipherMode){
  toast(T("Сегодня шифр уже разгадан.","Today's cipher is already solved."));return;
 }
 cipherMode=!cipherMode;clearCipher();tab="home";render();
}

    <button class="icon-button" data-action="close" aria-label="${T("Закрыть","Close")}">×</button>
   </div>${content}
  </section>
 </div>`;
 document.body.style.overflow="hidden";updateHUD();
}

function startPuzzle(){
 rollDays();
 if(state.puzzleDay===comboDay()){
  toast(T("Ключ за сегодня уже получен. Новый — после 15:00 МСК.","Today's key is already claimed. Next one after 15:00 Moscow time."));
  return;
 }
 puzzle={deadline:now()+60000,selected:"key",finished:false,won:false,moves:0,vehicles:[
  {id:"key",x:0,y:2,len:2,axis:"h",kind:"key"},
  {id:"a",x:2,y:1,len:2,axis:"v",kind:"red"},
  {id:"b",x:4,y:0,len:3,axis:"v",kind:"green"},
  {id:"c",x:0,y:4,len:2,axis:"h",kind:"green"},
  {id:"d",x:3,y:4,len:2,axis:"h",kind:"red"},
  {id:"e",x:5,y:0,len:2,axis:"v",kind:"red"},
  {id:"f",x:0,y:0,len:2,axis:"h",kind:"green"}
 ]};
 openModal("puzzle");
}
function puzzleHTML(){
 if(!puzzle)return "";
 if(puzzle.finished)return `
 <div style="text-align:center;font-size:70px;padding:20px">${puzzle.won?"🔑":"⌛"}</div>
 <h3 style="text-align:center">${puzzle.won?T("Путь открыт!","Path cleared!"):T("Попытка завершена","Attempt finished")}</h3>
 <p class="description" style="text-align:center">${puzzle.won?
  T("Получен 1 игровой ключ.","You earned 1 game key."):
  T("Попробуй ещё раз. Блоки двигаются только вдоль своей оси.","Try again. Blocks move only along their axis.")}</p>
 <button class="btn wide" data-action="${puzzle.won?"close":"puzzle-retry"}">
  ${puzzle.won?T("Отлично","Great"):T("Повторить","Try again")}
 </button>`;
 return `
 <div class="row"><strong class="gold">⏳ <span id="puzzle-timer"></span></strong><span class="small">${T("Ходов","Moves")}: ${puzzle.moves}</span></div>
 <p class="small">${T("Выбери блок и двигай стрелками. Проведи золотой ключ к выходу справа. Работает клавиатура.","Select a block and move it with arrows. Guide the gold key to the right exit. Keyboard arrows also work.")}</p>
 <div class="puzzle-board">
  ${Array.from({length:36},(_,i)=>`<div class="puzzle-cell" style="--r:${Math.floor(i/6)+1};--c:${i%6+1}"></div>`).join("")}
  ${puzzle.vehicles.map(v=>`
   <button class="vehicle ${v.kind==="red"?"red":v.kind==="key"?"key":""} ${puzzle.selected===v.id?"selected":""}"
    data-action="puzzle-select" data-id="${v.id}"
    aria-label="${v.id==="key"?T("Ключ","Key"):T("Блок ","Block ")+v.id}"
    style="grid-column:${v.x+1}/span ${v.axis==="h"?v.len:1};grid-row:${v.y+1}/span ${v.axis==="v"?v.len:1}">
    ${v.id==="key"?"🔑":v.axis==="h"?"↔":"↕"}
   </button>`).join("")}
  <div class="puzzle-exit">➜</div>
 </div>
 <div class="arrows">${[["left","←"],["up","↑"],["down","↓"],["right","→"]].map(([id,label])=>`
  <button class="btn secondary" data-action="puzzle-move" data-id="${id}" aria-label="${id}">${label}</button>`).join("")}</div>
 <p class="small" style="margin-top:13px">${T("60 секунд. Один ключ за игровой день. Закрытие окна завершает попытку.","60 seconds. One key per game day. Closing the dialog ends the attempt.")}</p>`;
}
function canPlace(vehicle,x,y){
 if(x<0||y<0||x+(vehicle.axis==="h"?vehicle.len:1)>6||
  y+(vehicle.axis==="v"?vehicle.len:1)>6)return false;
 for(let i=0;i<vehicle.len;i++){
  const cx=x+(vehicle.axis==="h"?i:0),cy=y+(vehicle.axis==="v"?i:0);
  for(const other of puzzle.vehicles){
   if(other.id===vehicle.id)continue;
   for(let j=0;j<other.len;j++){
    if(cx===other.x+(other.axis==="h"?j:0)&&
     cy===other.y+(other.axis==="v"?j:0))return false;
   }
  }
 }
 return true;
}
function movePuzzle(direction){
 if(!active||!puzzle||puzzle.finished)return;
 if(now()>=puzzle.deadline){endPuzzle(false);return}
 const vehicle=puzzle.vehicles.find(v=>v.id===puzzle.selected);
 const moves={left:[-1,0],right:[1,0],up:[0,-1],down:[0,1]};
 if(!vehicle||!moves[direction])return;
 const [dx,dy]=moves[direction];
 if((vehicle.axis==="h"&&dy)||(vehicle.axis==="v"&&dx))return;
 if(!canPlace(vehicle,vehicle.x+dx,vehicle.y+dy)){sound("error");return}
 vehicle.x+=dx;vehicle.y+=dy;puzzle.moves++;sound();
 if(vehicle.id==="key"&&vehicle.x+vehicle.len===6){endPuzzle(true);return}
 renderModal();
}
function endPuzzle(won){
 if(!puzzle||puzzle.finished)return;
 puzzle.finished=true;puzzle.won=won;
 if(won&&state.puzzleDay!==comboDay()){
  state.keys++;state.puzzleDay=comboDay();save();sound("reward");haptic();
 }else if(!won)sound("error");
 if(modalName==="puzzle")renderModal();
}

function buyCard(id){
 settle(false);rollDays();
 const c=CARD_BY_ID[id];
 if(!c)return;
 const reason=lockReason(c);
 if(reason){toast(reason);return}
 if((state.cards[id]||0)>=100)return;
 if(!spend(cardPrice(c))){
  toast(T("Недостаточно монет.","Not enough coins."));sound("error");return;
 }
 state.cards[id]=(state.cards[id]||0)+1;
 recalculateProfit();
 const found=dailyCombo().includes(id)&&!state.comboFound.includes(id);
 if(found)state.comboFound.push(id);
 /* Уровень и новый доход сохраняются сразу после покупки. */
 writeSave();sound("buy");render();
 if(modalName)renderModal();
 if(saveOK)toast(found?T("Найдено направление комбо!","Combo business found!"):
  T("Бизнес улучшен и сохранён.","Business upgraded and saved."));
}
function claimCombo(){
 settle(false);rollDays();
 if(state.comboClaimed||state.comboFound.length!==3)return;
 state.comboClaimed=true;credit(5000000);save();sound("reward");
 render();if(modalName)renderModal();
 toast(T("Комбо собрано! +5 000 000","Combo complete! +5,000,000"));
}
function buyBoost(type){
 if(!["tap","energy"].includes(type))return;
 settle(false);
 const level=type==="tap"?state.tapLevel:state.energyLevel;
 if(level>=100)return;
 if(!spend(boostPrice(type))){
  sound("error");toast(T("Недостаточно монет.","Not enough coins."));return;
 }
 if(type==="tap")state.tapLevel++;
 else{
  state.energyLevel++;state.energy=Math.min(maxEnergy(),state.energy+ENERGY_STEP);
 }
 save();sound("buy");render();renderModal();
}
function useFullEnergy(){
 settle(false);rollDays();
 if(state.boostUsed>=6||now()-state.boostLast<3600000)return;
 if(state.energy>=maxEnergy()-.1){
  toast(T("Энергия уже полная.","Energy is already full."));return;
 }
 state.energy=maxEnergy();state.boostUsed++;state.boostLast=now();
 save();sound("reward");render();renderModal();
}
function claimCheckin(){
 settle(false);
 const info=checkinInfo();
 if(info.claimed)return;
 const reward=CHECKIN[info.next-1];
 state.checkinStreak=info.streak+1;state.checkinLast=info.today;
 credit(reward);save();sound("reward");render();
 toast(T("Ежедневная награда: +","Daily reward: +")+fmt(reward));
}
function checkRank(){
 const rank=rankIndex();
 if(rank===lastRenderedRank)return;
 const increased=rank>lastRenderedRank;
 lastRenderedRank=rank;
 if(increased){toast(T("Новая лига: ","New league: ")+RANKS[rank][0]);sound("reward")}
}
function downloadBlob(blob,name){
 const url=URL.createObjectURL(blob),link=document.createElement("a");
 link.href=url;link.download=name;document.body.appendChild(link);
 link.click();link.remove();
 setTimeout(()=>URL.revokeObjectURL(url),2000);
}
function exportSave(){
 save();
 const data={
  ...state,hourlyProfit:profitPerHour(),
  assets:{...assets,photo:assets.photo||defaultPhotoData}
 };
 downloadBlob(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),
  "hamster-empire-save.json");
}
async function exportHTML(){
 const epoch=dataEpoch;
 try{
  const photo=await embedDefaultPhoto();
  if(epoch!==dataEpoch)return;
  const copy=document.documentElement.cloneNode(true);
  for(const id of ["header","main","nav","modal-root","toast-root"]){
   copy.querySelector("#"+id).innerHTML="";
  }
  copy.querySelector("body").style.overflow="";
  copy.querySelectorAll(".float-number").forEach(n=>n.remove());
  copy.querySelector("#embedded-assets").textContent=JSON.stringify({photo,avatar:""});
  downloadBlob(new Blob(["<!DOCTYPE html>\n"+copy.outerHTML],
   {type:"text/html;charset=utf-8"}),"hamster-empire-with-photo.html");
  toast(T("HTML с фото скачан. Для переноса прогресса используй JSON.","HTML with photo downloaded. Use JSON to transfer progress."));
 }catch(error){
  if(epoch===dataEpoch)toast(error.message||T("Не удалось встроить фото.","Could not embed photo."));
 }
}
async function importSave(){
 const file=$("#import-file")?.files?.[0],epoch=dataEpoch;
 if(!file){toast(T("Выбери JSON-файл.","Choose a JSON file."));return}
 if(file.size>12*1024*1024){toast(T("Максимум 12 МБ.","Maximum 12 MB."));return}
 try{
  const data=JSON.parse(await file.text());
  if(epoch!==dataEpoch)return;
  if(!validSave(data)||![1,2,3,4,5].includes(Number(data.version))){
   throw new Error("Invalid save");
  }
  dataEpoch++;
  state=normalizeState(data);state.lastSeen=now();
  if(data.assets)assets=normalizeAssets(data.assets);
  recalculateProfit();settleClock=now();displayedBalance=state.balance;
  lastRenderedRank=rankIndex();cipherMode=false;clearCipher();puzzle=null;tab="home";
  if(state.avatar==="custom"&&!assets.avatar)state.avatar="photo";
  rollDays();saveAssets();writeSave();closeModal();render();
  if(saveOK)toast(T("Прогресс импортирован. Доход восстановлен.","Progress imported. Profit restored."));
 }catch{
  if(epoch===dataEpoch)toast(T("Не удалось прочитать корректное сохранение.","Could not read a valid save."));
 }
}

document.addEventListener("click",event=>{
 const target=event.target;
 if(!(target instanceof Element))return;
 if(target.id==="overlay"){closeModal();return}
 const button=target.closest("[data-action]");
 if(!button||button.disabled||!active)return;
 const action=button.dataset.action,id=button.dataset.id;
 switch(action){
  case "tab":
   if(!["home","mine","earn","empire"].includes(id))break;
   if(modalName)closeModal();
   if(id!=="home"){cipherMode=false;clearCipher()}
   tab=id;render();window.scrollTo({top:0,behavior:"auto"});break;
  case "category":
   if(id!=="all"&&!CATEGORIES.some(c=>c.id===id))break;
   mineCategory=id;render();break;
  case "settings":openModal("settings");break;
  case "photo":openModal("photo");break;
  case "photo-upload":uploadImage(false);break;
  case "photo-remove":
   assets.photo="";saveAssets();save();render();renderModal();break;
  case "avatar":openModal("avatar");break;
  case "avatar-upload":uploadImage(true);break;
  case "avatar-select":
   if(![...AVATARS,"photo","custom"].includes(id)||(id==="custom"&&!assets.avatar))break;
   state.avatar=id;save();renderHeader();updateHUD();renderModal();break;
  case "exchange":openModal("exchange");break;
  case "exchange-select":
   if(!EXCHANGES.includes(id))break;
   state.exchange=id;save();closeModal();render();break;
  case "language":
   if(!["ru","en"].includes(id))break;
   state.language=id;save();render();renderModal();break;
  case "theme":
   if(!["dark","light"].includes(id))break;
   state.theme=id;save();render();renderModal();break;
  case "sound":
   state.sound=!state.sound;save();if(state.sound)sound("buy");renderModal();break;
  case "nickname-save":{
   const name=($("#nickname-input")?.value||"").trim().slice(0,24);
   if(!name){toast(T("Имя не может быть пустым.","Name cannot be empty."));break}
   state.nickname=name;save();renderHeader();updateHUD();
   if(saveOK)toast(T("Имя сохранено.","Name saved."));
   break;
  }
  case "close":closeModal();break;
  case "boosts":rollDays();openModal("boosts");break;
  case "boost-buy":buyBoost(id);break;
  case "full-energy":useFullEnergy();break;
  case "combo":rollDays();openModal("combo");break;
  case "combo-claim":claimCombo();break;
  case "card":if(CARD_BY_ID[id])openModal("card",id);break;
  case "card-buy":buyCard(id);break;
  case "checkin":claimCheckin();break;
  case "promo-activate":activatePromo();break;
  case "cipher-toggle":
   if(modalName)closeModal();
   toggleCipher();break;
  case "cipher-clear":clearCipher();updateCipherUI();break;
  case "cipher-help":openModal("cipher-help");break;
  case "stat-tap":{
   const t=performance.now();
   statTapTimes=statTapTimes.filter(value=>t-value<1200);
   statTapTimes.push(t);
   if(statTapTimes.length>=3){statTapTimes=[];toggleCipher()}
   break;
  }
  case "puzzle":
  case "puzzle-retry":startPuzzle();break;
  case "puzzle-select":
   if(puzzle&&!puzzle.finished&&puzzle.vehicles.some(v=>v.id===id)){
    puzzle.selected=id;renderModal();
   }
   break;
  case "puzzle-move":movePuzzle(id);break;
  case "offline-claim":{
   settle(false);
   const reward=state.pendingOffline;
   state.pendingOffline=0;
   credit(reward);save();sound("reward");checkRank();
   closeModal();render();
   if(reward>=1)toast(T("Офлайн-доход получен: +","Offline earnings claimed: +")+fmt(reward));
   break;
  }
  case "save-now":
   if(save())toast(T("Прогресс и доход сохранены.","Progress and profit saved."));
   updateHUD();break;
  case "export":exportSave();break;
  case "export-html":exportHTML();break;
  case "import":openModal("import");break;
  case "import-apply":importSave();break;
  case "reset-confirm":openModal("reset");break;
  case "reset":{
   dataEpoch++;
   const preferences={
    language:state.language,theme:state.theme,sound:state.sound,
    nickname:state.nickname,exchange:state.exchange,avatar:state.avatar
   };
   state=Object.assign(newState(),preferences);
   recalculateProfit();displayedBalance=0;settleClock=now();
   lastFrame=performance.now();lastRenderedRank=0;lastAcceptedTap=-Infinity;
   cipherMode=false;clearCipher();statTapTimes=[];puzzle=null;tab="home";
   mineCategory="markets";mineSearch="";mineSort="default";
   if(state.avatar==="custom"&&!assets.avatar)state.avatar="photo";
   writeSave();closeModal();render();
   if(saveOK)toast(T("Прогресс сброшен. Изображения сохранены.","Progress reset. Images preserved."));
   break;
  }
 }
});

document.addEventListener("input",event=>{
 const input=event.target;
 if(input instanceof HTMLInputElement&&input.id==="mine-search"){
  mineSearch=input.value;renderBusinessList();
 }
});
document.addEventListener("change",event=>{
 const input=event.target;
 if(input instanceof HTMLSelectElement&&input.id==="mine-sort"){
  if(!["default","price","profit","roi"].includes(input.value))return;
  mineSort=input.value;renderBusinessList();
 }
});
document.addEventListener("keydown",event=>{
 if(!active)return;
 if(event.key==="Escape"&&modalName){event.preventDefault();closeModal();return}
 if(event.key==="Tab"&&modalName){
  const modal=$(".modal");
  if(!modal)return;
  const focusable=[...modal.querySelectorAll(
   'button:not(:disabled),input:not(:disabled),select:not(:disabled),'+
   'textarea:not(:disabled),a[href],summary,[tabindex="0"]'
  )].filter(element=>element.getClientRects().length>0);
  if(!focusable.length){event.preventDefault();return}
  const first=focusable[0],last=focusable[focusable.length-1];
  const focused=document.activeElement;
  if(event.shiftKey&&(focused===first||!modal.contains(focused))){
   event.preventDefault();last.focus();
  }else if(!event.shiftKey&&(focused===last||!modal.contains(focused))){
   event.preventDefault();first.focus();
  }
  return;
 }
 const target=event.target;
 const editing=target instanceof Element&&(
  target.matches("input,textarea,select")||target.isContentEditable
 );
 if(event.key==="Enter"&&editing){
  if(target.id==="promo-input"){event.preventDefault();activatePromo();return}
  if(modalName==="settings"&&target.id==="nickname-input"){
   event.preventDefault();$('[data-action="nickname-save"]')?.click();return;
  }
 }
 if(editing)return;
 if(modalName==="puzzle"&&puzzle&&!puzzle.finished){
  const direction={
   ArrowLeft:"left",ArrowRight:"right",ArrowUp:"up",ArrowDown:"down"
  }[event.key];
  if(direction){event.preventDefault();movePuzzle(direction)}
 }
});

function suspendGame(){
 if(active){settle(false);active=false}
 activePointers.clear();clearTimeout(cipherTimer);cipherSymbols="";updateCipherUI();
 const hero=$("#hero");
 if(hero)hero.style.transform="";
 writeSave();
}
function resumeGame(){
 if(active||document.hidden)return;
 settle(true);const changed=rollDays();
 active=true;lastFrame=performance.now();lastHUD=0;
 if(changed){render();if(modalName)renderModal()}
 else updateHUD();
 if(puzzle&&!puzzle.finished&&now()>=puzzle.deadline)endPuzzle(false);
 writeSave();
 if(state.pendingOffline>=1&&!modalName)openModal("offline");
 else if(modalName==="offline")renderModal();
}
document.addEventListener("visibilitychange",()=>{
 if(document.hidden)suspendGame();
 else resumeGame();
});
window.addEventListener("pagehide",suspendGame);
window.addEventListener("pageshow",()=>{if(!document.hidden)resumeGame()});
window.addEventListener("beforeunload",()=>{
 if(active)settle(false);
 writeSave();
});

function animationFrame(timestamp){
 requestAnimationFrame(animationFrame);
 const dt=clamp((timestamp-lastFrame)/1000,0,.1);
 lastFrame=timestamp;
 if(!active||document.hidden)return;

 const balanceElement=$("#balance-number");
 if(balanceElement){
  const difference=state.balance-displayedBalance;
  if(Math.abs(difference)<.5)displayedBalance=state.balance;
  else displayedBalance+=difference*(1-Math.exp(-dt*14));
  const text=fmt(displayedBalance);
  if(balanceElement.textContent!==text)balanceElement.textContent=text;
 }
 if(timestamp-lastHUD<200)return;
 lastHUD=timestamp;settle(false);
 if(rollDays()){
  writeSave();render();if(modalName)renderModal();
 }
 if(puzzle&&!puzzle.finished&&now()>=puzzle.deadline)endPuzzle(false);
 checkRank();updateHUD();
}

/* Сохраняются весь прогресс и уровни бизнесов, а не только баланс. */
setInterval(()=>{
 if(!active||document.hidden)return;
 settle(false);writeSave();updateHUD();
},2000);

function validateConfiguration(){
 if(CARDS.length!==60)console.error("Ожидалось 60 бизнес-направлений.");
 if(new Set(CARDS.map(c=>c.id)).size!==CARDS.length){
  console.error("Повторяющиеся идентификаторы бизнесов.");
 }
 for(const card of CARDS){
  if(card.dep&&!CARD_BY_ID[card.dep[0]]){
   console.error("Не найдена зависимость:",card.id,card.dep[0]);
  }
 }
}

/* Автоматический запуск без регистрации. */
validateConfiguration();
loadProgress();
if(state.avatar==="custom"&&!assets.avatar)state.avatar="photo";
recalculateProfit();
displayedBalance=state.balance;
settleClock=state.lastSeen;
settle(true);
rollDays();
active=!document.hidden;
lastRenderedRank=rankIndex();
writeSave();
saveAssets();
render();
requestAnimationFrame(animationFrame);

setTimeout(()=>{
 if(migrationMessage){
  toast(T(
   "Старый прогресс перенесён. Регистрация больше не нужна.",
   "Old progress transferred. Registration is no longer needed."
  ));
 }
 if(active&&state.pendingOffline>=1&&!modalName)openModal("offline");
},400);
</script>
